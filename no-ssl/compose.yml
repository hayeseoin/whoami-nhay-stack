name: nhay-stack-whoami
services:  
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_HOSTNAME}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=web"
      - "traefik.docker.network=platform"
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-whoami-nossl}
    networks:
      - platform

networks:
  platform:
    external: true
