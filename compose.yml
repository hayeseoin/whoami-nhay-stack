services:  
  whoami:
    image: traefik/whoami
    container_name: ${CONTAINER_NAME:-whoami}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_HOSTNAME}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.docker.network=platform"
    networks:
      - platform

networks:
  platform:
    external: true
