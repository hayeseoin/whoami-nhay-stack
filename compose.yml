name: nhay-stack-whoami
services:  
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`stack.platform-test.nhay.es`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.docker.network=platform"
    networks:
      - platform
    environment:
      COMPOSE_PROJECT_NAME: whoami

networks:
  platform
    external: true
