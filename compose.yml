services:  
  whoami:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-whoami}.rule=Host(`${APP_HOSTNAME:-whoami.localhost}`)"
      - "traefik.http.routers.${APP_NAME:-whoami}.entrypoints=websecure"
      - "traefik.docker.network=platform"
    networks:
      - platform

networks:
  platform:
    external: true
